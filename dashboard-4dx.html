<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4DX Dashboard — OvocxMalinowi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F7F6F2;
      --card: #ffffff;
      --border: #E8E6DE;
      --header-bg: #F0EFE9;
      --text: #1a1a1a;
      --text-muted: #6b6b6b;
      --lag-accent: #D64E12;
      --lag-accent-light: #FDF0EB;
      --lead-accent: #1A5EA8;
      --lead-accent-light: #E8F0FA;
      --green: #16a34a;
      --orange: #ea580c;
      --red: #dc2626;
      --col-week: 52px;
      --col-target: 72px;
      --col-deadline: 76px;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(0,0,0,0.08);
      /* Aliases for linkage features */
      --lag: #D64E12; --lag2: #FDF0EB;
      --lead: #1A5EA8; --lead2: #E8F0FA;
      --gr: #16a34a; --re: #dc2626; --re2: #fef2f2;
      --t3: #aaa;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Familjen Grotesk', -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; }
    a { color: inherit; text-decoration: none; }

    /* TOPBAR */
    #topbar {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; align-items: center; gap: 16px;
      position: sticky; top: 0; z-index: 100;
    }
    #topbar .logo { font-size: 15px; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
    #topbar .logo span { color: var(--lag-accent); }
    #topbar .week-badge {
      background: var(--lag-accent); color: #fff;
      padding: 3px 10px; border-radius: 20px;
      font-size: 12px; font-weight: 700; font-family: 'DM Mono', monospace;
    }
    #topbar .spacer { flex: 1; }
    #topbar .back-link { color: var(--text-muted); font-size: 13px; }

    /* CONTENT */
    #content { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

    /* WIG HEADER */
    .wig-header {
      background: var(--card); border-radius: var(--radius);
      padding: 18px 20px; margin-bottom: 20px;
      border-left: 4px solid var(--lag-accent);
      box-shadow: var(--shadow);
      display: flex; align-items: center; gap: 16px;
    }
    .wig-header-text { flex: 1; }
    .wig-header-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); font-weight: 700; margin-bottom: 3px; }
    .wig-header-name { font-size: 18px; font-weight: 800; line-height: 1.2; }
    .wig-header-desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .wig-header-meta { text-align: right; }
    .wig-progress-num { font-size: 28px; font-weight: 800; color: var(--lag-accent); font-family: 'DM Mono', monospace; }
    .wig-progress-label { font-size: 11px; color: var(--text-muted); }
    .wig-deadline { font-size: 12px; color: var(--text-muted); margin-top: 2px; font-family: 'DM Mono', monospace; }

    /* SECTION LABELS */
    .section-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em;
      font-weight: 700; color: var(--text-muted); margin: 24px 0 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* TABLE CARD */
    .table-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow); margin-bottom: 16px; overflow: hidden;
    }
    .table-card-header {
      padding: 12px 16px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .table-card-header .badge {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px;
      font-family: 'DM Mono', monospace; white-space: nowrap;
    }
    .lag-badge  { background: var(--lag-accent-light);  color: var(--lag-accent); }
    .lead-badge { background: var(--lead-accent-light); color: var(--lead-accent); }
    .table-card-title { font-weight: 700; font-size: 14px; flex: 1; }
    .table-card-deadline { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

    /* DATA TABLE */
    .data-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    .data-table th {
      background: var(--header-bg); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
      padding: 7px 8px; text-align: left; border-bottom: 1px solid var(--border);
      color: var(--text-muted); white-space: nowrap; overflow: hidden;
    }
    .data-table th.week-col, .data-table td.week-col {
      width: 52px; text-align: center;
    }
    .data-table th.target-col, .data-table td.target-col { width: 72px; }
    .data-table th.deadline-col, .data-table td.deadline-col { width: 76px; }
    .data-table th.actions-col, .data-table td.actions-col { width: 32px; text-align: center; }
    .data-table td {
      padding: 7px 8px; border-bottom: 1px solid var(--border);
      vertical-align: middle; overflow: hidden;
    }
    .data-table tr:last-child td { border-bottom: none; }

    /* WEEK ACTIVE TINTS */
    .lag-table  th.week-col.active { background: var(--lag-accent-light); }
    .lag-table  td.week-col.active { background: var(--lag-accent-light); }
    .lead-table th.week-col.active { background: var(--lead-accent-light); }
    .lead-table td.week-col.active { background: var(--lead-accent-light); }

    /* LAG EDITABLE CELLS */
    .cell-lag { cursor: pointer; font-family: 'DM Mono', monospace; font-size: 13px; }
    .cell-lag:hover { background: var(--header-bg); }
    .cell-lag.editing { padding: 2px 4px; }
    .cell-lag input {
      width: 100%; border: 1px solid var(--lead-accent); border-radius: 4px;
      padding: 2px 4px; font-family: 'DM Mono', monospace; font-size: 13px;
      text-align: center; outline: none; background: #fff;
    }
    .cell-lag.saved { outline: 2px solid var(--green); outline-offset: -2px; border-radius: 2px; }
    .cell-lag.error { outline: 2px solid var(--red);   outline-offset: -2px; border-radius: 2px; }

    /* LEAD TOGGLE CELLS */
    .cell-lead { cursor: pointer; text-align: center; font-size: 15px; user-select: none; }
    .cell-lead:hover { background: var(--header-bg); }
    .cell-lead.done { color: var(--green); }
    .cell-lead.miss { color: var(--red); opacity: 0.45; }

    /* PROGRESS ROW */
    tr.progress-row td {
      background: var(--header-bg); font-weight: 700;
      font-family: 'DM Mono', monospace; font-size: 13px;
      border-top: 2px solid var(--border);
    }
    tr.progress-row td.name-col {
      font-family: 'Familjen Grotesk', sans-serif; font-size: 12px;
      color: var(--text-muted); font-weight: 600;
    }
    .progress-val.green  { color: var(--green); }
    .progress-val.orange { color: var(--orange); }
    .progress-val.red    { color: var(--red); }

    /* INLINE NAME EDIT */
    .item-name { cursor: pointer; }
    .item-name:hover { text-decoration: underline dotted; }
    .item-name.editing-name input {
      width: 100%; border: 1px solid var(--lead-accent); border-radius: 4px;
      padding: 2px 6px; font-size: 13px; outline: none; background: #fff;
      font-family: 'Familjen Grotesk', sans-serif;
    }

    /* DELETE BUTTON */
    .delete-btn {
      opacity: 0; background: none; border: none; cursor: pointer;
      color: var(--red); font-size: 14px; padding: 2px 4px; border-radius: 4px;
      transition: opacity 0.15s; line-height: 1;
    }
    tr:hover .delete-btn { opacity: 0.6; }
    .delete-btn:hover { opacity: 1 !important; background: #fff0f0; }

    /* TABLE ACTIONS */
    .table-actions {
      padding: 8px 12px; display: flex; gap: 8px; flex-wrap: wrap;
      border-top: 1px solid var(--border); align-items: center;
    }
    .btn-add {
      font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 6px;
      border: 1px solid var(--border); background: var(--header-bg);
      cursor: pointer; color: var(--text); transition: background 0.15s;
      font-family: 'Familjen Grotesk', sans-serif;
    }
    .btn-add:hover { background: var(--border); }

    /* ADD ITEM FORM ROW */
    .add-item-row td {
      padding: 6px 8px; background: #fafaf8;
    }
    .add-item-row input {
      border: 1px solid var(--border); border-radius: 4px;
      padding: 4px 8px; font-size: 13px; outline: none; background: #fff;
      font-family: 'Familjen Grotesk', sans-serif;
    }
    .add-item-row input:focus { border-color: var(--lead-accent); }
    .add-item-row .btn-ok {
      background: var(--lead-accent); color: #fff; border: none;
      padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 13px;
      font-family: 'Familjen Grotesk', sans-serif;
    }
    .add-item-row .btn-cancel {
      background: none; border: 1px solid var(--border); color: var(--text-muted);
      padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
      font-family: 'Familjen Grotesk', sans-serif;
    }

    /* ADD WEEK INLINE */
    .add-week-inline {
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; background: var(--header-bg); border: 1px solid var(--border);
      border-radius: 6px; padding: 2px 8px;
    }
    .add-week-inline input {
      width: 44px; border: 1px solid var(--border); border-radius: 4px;
      padding: 2px 4px; font-size: 13px; text-align: center;
      font-family: 'DM Mono', monospace; outline: none; background: #fff;
    }
    .add-week-inline input:focus { border-color: var(--lead-accent); }
    .add-week-inline .btn-ok {
      background: var(--lead-accent); color: #fff; border: none;
      padding: 2px 8px; border-radius: 4px; cursor: pointer; font-size: 12px;
      font-family: 'Familjen Grotesk', sans-serif;
    }
    .add-week-inline .btn-cancel {
      background: none; border: none; color: var(--text-muted);
      padding: 2px 4px; cursor: pointer; font-size: 13px;
    }

    /* TOAST */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 9999;
      display: flex; flex-direction: column; gap: 8px; pointer-events: none;
    }
    .toast-item {
      padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15); opacity: 0;
      animation: toastIn 0.2s ease forwards; max-width: 320px;
    }
    .toast-item.success { background: #f0fdf4; color: var(--green); border: 1px solid #bbf7d0; }
    .toast-item.error   { background: #fef2f2; color: var(--red);   border: 1px solid #fecaca; }
    @keyframes toastIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

    /* OFFLINE BANNER */
    #offline-banner {
      display: none; position: sticky; top: 53px; z-index: 99;
      background: #fef3c7; border-bottom: 1px solid #fcd34d;
      padding: 8px 24px; font-size: 13px; font-weight: 600; color: #92400e;
      text-align: center;
    }

    /* SKELETON */
    .skeleton {
      background: linear-gradient(90deg, #eee 25%, #f5f5f5 50%, #eee 75%);
      background-size: 200% 100%; animation: shimmer 1.2s infinite;
      border-radius: 6px; height: 16px; margin: 6px 0;
    }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .skeleton-block { padding: 20px; }

    /* MISC */
    .mono { font-family: 'DM Mono', monospace; }
    .empty-state { padding: 32px; text-align: center; color: var(--text-muted); font-size: 13px; }
    .wig-section + .wig-section { margin-top: 48px; padding-top: 24px; border-top: 2px solid var(--border); }

    /* TABS */
    #tab-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 0 24px; position: sticky; top: 53px; z-index: 90; }
    .tabs { display: flex; gap: 0; }
    .tab { padding: 10px 20px; font-size: 13px; font-weight: 600; color: var(--text-muted); background: transparent; border: none; border-bottom: 2px solid transparent; cursor: pointer; margin-bottom: -1px; transition: all .15s; font-family: 'Familjen Grotesk', sans-serif; }
    .tab.active { color: var(--text); border-bottom-color: var(--text); }
    .tab:hover:not(.active) { color: var(--text); }

    /* LINK TAGS */
    .link-tags { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 6px 16px 8px; border-bottom: 1px solid var(--border); background: var(--header-bg); }
    .link-label { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--t3); text-transform: uppercase; letter-spacing: .1em; margin-right: 2px; white-space: nowrap; }
    .link-tag { font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 99px; cursor: pointer; transition: all .15s; border: 1px solid transparent; }
    .link-tag.lag-tag { background: var(--lag2); color: var(--lag); border-color: rgba(214,78,18,.2); }
    .link-tag.lead-tag { background: var(--lead2); color: var(--lead); border-color: rgba(26,94,168,.2); }
    .link-tag:hover { opacity: .75; }
    .table-card.highlighted { outline: 2px solid var(--lead); outline-offset: 2px; border-radius: var(--radius); animation: pulse-hl 1.5s ease-out forwards; }
    @keyframes pulse-hl { 0%{outline-color:var(--lead)} 100%{outline-color:transparent} }
    .link-add { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--t3); background: transparent; border: 1px dashed var(--border); border-radius: 99px; padding: 2px 8px; cursor: pointer; }
    .link-add:hover { color: var(--text-muted); border-color: var(--text-muted); }

    /* IMPACT VIEW */
    #impact-view { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }
    .impact-block { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px 24px; margin-bottom: 16px; border: 1px solid var(--border); }
    .impact-lag-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    .impact-lag-name { font-size: 14px; font-weight: 700; flex: 1; }
    .impact-lag-pct { font-family: 'DM Mono', monospace; font-size: 18px; font-weight: 500; }
    .impact-lead-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--header-bg); flex-wrap: wrap; }
    .impact-lead-row:last-child { border-bottom: none; }
    .impact-lead-info { display: flex; align-items: center; gap: 8px; min-width: 260px; flex: 1; }
    .impact-lead-name { font-size: 12px; flex: 1; color: var(--text-muted); }
    .impact-lead-pct { font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500; }
    .impact-arrow-row { display: flex; align-items: center; gap: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
    .impact-arrow { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--t3); text-transform: uppercase; letter-spacing: .08em; white-space: nowrap; }
    .impact-lag-result { display: flex; align-items: center; gap: 12px; flex: 1; }
    .impact-progress-bar { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
    .impact-progress-fill { height: 100%; border-radius: 99px; background: var(--lag); }
    .impact-chart { flex-shrink: 0; }
    .unlink-btn { background: transparent; border: none; color: var(--t3); font-size: 12px; cursor: pointer; padding: 4px 6px; border-radius: 3px; line-height: 1; }
    .unlink-btn:hover { color: var(--red); background: var(--re2); }

    /* LINK DROPDOWN */
    .link-dropdown { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,.12); min-width: 220px; overflow: hidden; }
    .link-option { padding: 9px 14px; font-size: 12px; cursor: pointer; color: var(--text); }
    .link-option:hover { background: var(--header-bg); }
  </style>
</head>
<body>

<div id="topbar">
  <div class="logo">Ovocx<span>Malinowi</span></div>
  <div id="week-badge" class="week-badge">T—</div>
  <div class="spacer"></div>
  <a class="back-link" href="index.html">← Dashboard główny</a>
</div>

<div id="offline-banner">⚡ Brak połączenia z bazą — zmiany nie są zapisywane</div>

<div id="tab-bar">
  <div class="tabs">
    <button class="tab active" data-tab="scoreboard">Scoreboard</button>
    <button class="tab" data-tab="impact">Powiązania</button>
  </div>
</div>

<div id="scoreboard-view">
<div id="content">
  <div class="skeleton-block">
    <div class="skeleton" style="width:40%;height:24px;"></div>
    <div class="skeleton" style="width:70%;margin-top:12px;"></div>
    <div class="skeleton" style="width:55%;margin-top:8px;"></div>
    <div class="skeleton" style="margin-top:20px;height:120px;border-radius:8px;"></div>
  </div>
</div>
</div><!-- end scoreboard-view -->

<div id="impact-view" style="display:none"></div>

<div id="toast"></div>

<script>
/* ═══════════════════════════════════
   CONFIG
═══════════════════════════════════ */
const SB_URL = 'https://fssfuricylndtetfktex.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzc2Z1cmljeWxuZHRldGZrdGV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODUzMjgsImV4cCI6MjA4OTI2MTMyOH0.Xs6kne86IQpGb8ShvU9zntQDTkQNGBuXKajxnWHOUYQ';

/* ═══════════════════════════════════
   SUPABASE HELPERS
═══════════════════════════════════ */
async function sbFetch(path, opts) {
  opts = opts || {};
  const res = await fetch(SB_URL + '/rest/v1/' + path, Object.assign({}, opts, {
    headers: Object.assign({
      'apikey': SB_KEY,
      'Authorization': 'Bearer ' + SB_KEY,
      'Content-Type': 'application/json',
      'Accept': 'application/json'
    }, opts.headers || {})
  }));
  if (!res.ok) {
    const txt = await res.text().catch(function(){ return res.statusText; });
    throw new Error('Supabase ' + res.status + ': ' + txt);
  }
  if (res.status === 204) return null;
  return res.json();
}
function sbGet(table, qs) {
  return sbFetch(table + (qs ? '?' + qs : ''));
}
function sbUpsert(table, data, onConflict) {
  var qs = onConflict ? '?on_conflict=' + encodeURIComponent(onConflict) : '';
  var body = Array.isArray(data) ? data : [data];
  return sbFetch(table + qs, {
    method: 'POST',
    headers: { 'Prefer': 'resolution=merge-duplicates,return=representation' },
    body: JSON.stringify(body)
  });
}
function sbInsert(table, data) {
  return sbFetch(table, {
    method: 'POST',
    headers: { 'Prefer': 'return=representation' },
    body: JSON.stringify(data)
  });
}
function sbPatch(table, filter, data) {
  return sbFetch(table + '?' + filter, {
    method: 'PATCH',
    headers: { 'Prefer': 'return=representation' },
    body: JSON.stringify(data)
  });
}
function sbDelete(table, filter) {
  return sbFetch(table + '?' + filter, { method: 'DELETE' });
}

/* ═══════════════════════════════════
   STATE
═══════════════════════════════════ */
var state = {
  areas: [], lags: [], lagItems: [], lagWeekly: [],
  leads: [], leadItems: [], leadWeekly: [],
  currentWeek: 12,
  lagWeeklyMap: {}, leadWeeklyMap: {},
  allWeeks: [],
  links: []
};

/* ═══════════════════════════════════
   LOAD ALL
═══════════════════════════════════ */
async function loadAll() {
  var results = await Promise.all([
    sbGet('areas',      'select=*&order=id'),
    sbGet('lags',       'select=*&order=area_id,lag_number'),
    sbGet('lag_items',  'select=*&order=lag_id,sort_order,id'),
    sbGet('lag_weekly', 'select=*'),
    sbGet('leads',      'select=*&order=area_id,lead_number'),
    sbGet('lead_items', 'select=*&order=lead_id,sort_order,id'),
    sbGet('lead_weekly','select=*'),
    sbGet('config',     'select=*'),
    sbGet('lag_lead_links', 'select=*').catch(function(){ return []; })
  ]);
  var areas = results[0] || [], lags = results[1] || [], lagItems = results[2] || [],
      lagWeekly = results[3] || [], leads = results[4] || [], leadItems = results[5] || [],
      leadWeekly = results[6] || [], config = results[7] || [], links = results[8] || [];

  var cwRow = config.find(function(r){ return r.key === 'current_week'; });
  var currentWeek = cwRow ? parseInt(cwRow.value, 10) : 12;

  var lagWeeklyMap = {};
  lagWeekly.forEach(function(r){
    if (!lagWeeklyMap[r.lag_item_id]) lagWeeklyMap[r.lag_item_id] = {};
    lagWeeklyMap[r.lag_item_id][r.week] = r.value;
  });
  var leadWeeklyMap = {};
  leadWeekly.forEach(function(r){
    if (!leadWeeklyMap[r.lead_item_id]) leadWeeklyMap[r.lead_item_id] = {};
    leadWeeklyMap[r.lead_item_id][r.week] = r.value;
  });

  var weekSet = {};
  lagWeekly.forEach(function(r){ weekSet[r.week] = 1; });
  leadWeekly.forEach(function(r){ weekSet[r.week] = 1; });
  weekSet[currentWeek] = 1;
  var allWeeks = Object.keys(weekSet).map(Number).sort(function(a,b){ return a-b; });

  Object.assign(state, { areas, lags, lagItems, lagWeekly, leads, leadItems, leadWeekly,
    currentWeek, lagWeeklyMap, leadWeeklyMap, allWeeks, links });
}

/* ═══════════════════════════════════
   LINK HELPERS
═══════════════════════════════════ */
function getLeadsForLag(lagId) {
  return state.links.filter(function(l){ return l.lag_id === lagId; })
    .map(function(l){ return state.leads.find(function(e){ return e.id === l.lead_id; }); })
    .filter(Boolean);
}
function getLagsForLead(leadId) {
  return state.links.filter(function(l){ return l.lead_id === leadId; })
    .map(function(l){ return state.lags.find(function(g){ return g.id === l.lag_id; }); })
    .filter(Boolean);
}
function colorStr(val) {
  if (val == null) return 'var(--text-muted)';
  if (val >= 0.7) return 'var(--green)';
  if (val >= 0.3) return 'var(--orange)';
  return 'var(--red)';
}

/* ═══════════════════════════════════
   PROGRESS MATH
═══════════════════════════════════ */
function lagProgress(itemIds, week) {
  if (!itemIds.length) return null;
  var sum = 0;
  itemIds.forEach(function(id){
    var v = (state.lagWeeklyMap[id] || {})[week];
    sum += v != null ? parseFloat(v) : 0;
  });
  return sum / itemIds.length;
}
function leadProgress(itemIds, week) {
  if (!itemIds.length) return null;
  var done = itemIds.filter(function(id){
    var v = (state.leadWeeklyMap[id] || {})[week];
    return v != null && parseFloat(v) >= 0.999;
  }).length;
  return done / itemIds.length;
}
function pColor(val) {
  if (val == null) return '';
  if (val >= 0.7) return 'green';
  if (val >= 0.3) return 'orange';
  return 'red';
}
function fmtPct(val) {
  if (val == null) return '—';
  return Math.round(val * 100) + '%';
}
function wLabel(w) { return 'T' + w; }

/* ═══════════════════════════════════
   RENDER LAG TABLE
═══════════════════════════════════ */
function renderLagTable(lag) {
  var items = state.lagItems.filter(function(i){ return i.lag_id === lag.id; });
  var weeks = state.allWeeks;

  var headWeeks = weeks.map(function(w){
    return '<th class="week-col' + (w === state.currentWeek ? ' active' : '') + '">' + wLabel(w) + '</th>';
  }).join('');

  var dataRows = items.map(function(item){
    var tgt = item.target != null ? fmtPct(parseFloat(item.target)) : '100%';
    var dl  = item.deadline_week ? wLabel(item.deadline_week) : '—';
    var cells = weeks.map(function(w){
      var raw = (state.lagWeeklyMap[item.id] || {})[w];
      var disp = raw != null ? fmtPct(parseFloat(raw)) : '—';
      var act = w === state.currentWeek ? ' active' : '';
      return '<td class="week-col cell-lag' + act + '" data-item="' + item.id + '" data-week="' + w + '">' + disp + '</td>';
    }).join('');
    return '<tr data-row-id="' + item.id + '">'
      + '<td class="name-col"><span class="item-name" data-type="lag" data-id="' + item.id + '">' + esc(item.name) + '</span></td>'
      + '<td class="target-col mono">' + tgt + '</td>'
      + cells
      + '<td class="deadline-col mono">' + dl + '</td>'
      + '<td class="actions-col"><button class="delete-btn" data-del-lag="' + item.id + '" title="Usuń">✕</button></td>'
      + '</tr>';
  }).join('');

  var itemIds = items.map(function(i){ return i.id; });
  var progCells = weeks.map(function(w){
    var val = lagProgress(itemIds, w);
    var act = w === state.currentWeek ? ' active' : '';
    return '<td class="week-col' + act + '"><span class="progress-val ' + pColor(val) + '">' + fmtPct(val) + '</span></td>';
  }).join('');

  var colCount = 4 + weeks.length;
  var colsDef = '<col><!-- name --><col style="width:72px;">'
    + weeks.map(function(){ return '<col style="width:52px;">'; }).join('')
    + '<col style="width:76px;"><col style="width:32px;">';

  var linkedLeads = getLeadsForLag(lag.id);
  var lagLinkTagsHtml = '<div class="link-tags">'
    + '<span class="link-label">Napędzane przez:</span>'
    + linkedLeads.map(function(e){ return '<span class="link-tag lead-tag" data-highlight="lead-' + e.id + '">← LEAD-' + String(e.lead_number).padStart(2,'0') + '</span>'; }).join('')
    + '<button class="link-add" data-lag-id="' + lag.id + '">+ powiąż</button>'
    + '</div>';

  return '<div class="table-card" id="lag-card-' + lag.id + '" data-section-id="lag-' + lag.id + '">'
    + '<div class="table-card-header">'
    + '<span class="badge lag-badge">LAG-' + String(lag.lag_number).padStart(2,'0') + '</span>'
    + '<span class="table-card-title">' + esc(lag.name) + '</span>'
    + '<span class="table-card-deadline">Deadline: ' + (lag.deadline_week ? wLabel(lag.deadline_week) : '—') + '</span>'
    + '</div>'
    + lagLinkTagsHtml
    + '<div style="overflow-x:auto;">'
    + '<table class="data-table lag-table">'
    + '<colgroup>' + colsDef + '</colgroup>'
    + '<thead><tr>'
    + '<th class="name-col">Kryterium</th>'
    + '<th class="target-col">Target</th>'
    + headWeeks
    + '<th class="deadline-col">Deadline</th>'
    + '<th class="actions-col"></th>'
    + '</tr></thead>'
    + '<tbody id="lag-tbody-' + lag.id + '">'
    + dataRows
    + '<tr class="add-ph-lag" data-lag-id="' + lag.id + '"><td colspan="' + colCount + '"></td></tr>'
    + '</tbody>'
    + '<tfoot><tr class="progress-row" id="lag-prog-' + lag.id + '">'
    + '<td class="name-col">POSTĘP (średnia)</td>'
    + '<td class="target-col"></td>'
    + progCells
    + '<td class="deadline-col"></td>'
    + '<td class="actions-col"></td>'
    + '</tr></tfoot>'
    + '</table></div>'
    + '<div class="table-actions">'
    + '<button class="btn-add" data-addw-lag="' + lag.id + '">+ Dodaj tydzień</button>'
    + '<button class="btn-add" data-addi-lag="' + lag.id + '">+ Dodaj kryterium</button>'
    + '</div>'
    + '</div>';
}

/* ═══════════════════════════════════
   LINKAGE VIEWS & ACTIONS
═══════════════════════════════════ */
function renderCorrelationChart(lagId, leadId, containerEl) {
  var weeks = state.allWeeks;
  var W = 200, H = 48, PAD = 4;
  function weekAvg(items, weeklyMap, w) {
    if (!items.length) return null;
    var vals = items.map(function(i){ var v = (weeklyMap[i.id] || {})[w]; return v !== undefined ? v : null; });
    var valid = vals.filter(function(v){ return v !== null; });
    return valid.length ? valid.reduce(function(a,b){ return a+b; }, 0) / valid.length : null;
  }
  var lagItems  = state.lagItems.filter(function(i){ return i.lag_id === lagId; });
  var leadItems = state.leadItems.filter(function(i){ return i.lead_id === leadId; });
  var lagData   = weeks.map(function(w){ return weekAvg(lagItems,  state.lagWeeklyMap,  w); });
  var leadData  = weeks.map(function(w){ return weekAvg(leadItems, state.leadWeeklyMap, w); });
  function makePath(data, color) {
    var pts = [];
    data.forEach(function(v, i){
      if (v !== null) { pts.push([(PAD+(i/(weeks.length-1))*(W-PAD*2)).toFixed(1), (H-PAD-v*(H-PAD*2)).toFixed(1)]); }
    });
    if (pts.length < 2) return '';
    var d = pts.map(function(p, i){ return (i ? 'L' : 'M') + p[0] + ',' + p[1]; }).join(' ');
    var dots = pts.map(function(p, i){ return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (i === pts.length-1 ? 3 : 2) + '" fill="' + color + '" opacity="' + (i === pts.length-1 ? 1 : .5) + '"/>'; }).join('');
    return '<path d="' + d + '" stroke="' + color + '" stroke-width="1.5" fill="none" opacity=".8"/>' + dots;
  }
  var cwIdx = weeks.indexOf(state.currentWeek);
  var cx = cwIdx >= 0 ? (PAD + (cwIdx / (weeks.length - 1)) * (W - PAD * 2)).toFixed(1) : null;
  var curLine = cx ? '<line x1="' + cx + '" y1="0" x2="' + cx + '" y2="' + H + '" stroke="#aaa" stroke-width="1" stroke-dasharray="2,2" opacity=".5"/>' : '';
  containerEl.innerHTML = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" style="overflow:visible;display:block">' + curLine + makePath(lagData, '#D64E12') + makePath(leadData, '#1A5EA8') + '</svg>'
    + '<div style="display:flex;gap:10px;margin-top:3px"><span style="font-family:\'DM Mono\',monospace;font-size:9px;color:#D64E12">— LAG</span><span style="font-family:\'DM Mono\',monospace;font-size:9px;color:#1A5EA8">— LEAD</span></div>';
}

function renderImpactView() {
  var el = document.getElementById('impact-view');
  var blocks = state.lags.map(function(lag){
    var linkedLeads = getLeadsForLag(lag.id);
    if (!linkedLeads.length) return '';
    var lagItemIds = state.lagItems.filter(function(i){ return i.lag_id === lag.id; }).map(function(i){ return i.id; });
    var pg = lagProgress(lagItemIds, state.currentWeek);
    var leadRows = linkedLeads.map(function(lead){
      var leadItemIds = state.leadItems.filter(function(i){ return i.lead_id === lead.id; }).map(function(i){ return i.id; });
      var lp = leadProgress(leadItemIds, state.currentWeek);
      return '<div class="impact-lead-row">'
        + '<div class="impact-lead-info">'
        + '<span class="badge lead-badge">LEAD-' + String(lead.lead_number).padStart(2,'0') + '</span>'
        + '<span class="impact-lead-name">' + esc(lead.name) + '</span>'
        + '<span class="impact-lead-pct" style="color:' + colorStr(lp) + '">' + fmtPct(lp) + '</span>'
        + '</div>'
        + '<div class="impact-chart" data-chart-lag="' + lag.id + '" data-chart-lead="' + lead.id + '"></div>'
        + '<button class="unlink-btn" data-lag-id="' + lag.id + '" data-lead-id="' + lead.id + '" title="Usuń powiązanie">✕</button>'
        + '</div>';
    }).join('');
    return '<div class="impact-block">'
      + '<div class="impact-lag-header">'
      + '<span class="badge lag-badge">LAG-' + String(lag.lag_number).padStart(2,'0') + '</span>'
      + '<span class="impact-lag-name">' + esc(lag.name) + '</span>'
      + '<span class="impact-lag-pct" style="color:' + colorStr(pg) + '">' + fmtPct(pg) + '</span>'
      + '</div>'
      + '<div class="impact-leads">' + leadRows + '</div>'
      + '<div class="impact-arrow-row">'
      + '<div class="impact-arrow">↓ przekłada się na</div>'
      + '<div class="impact-lag-result">'
      + '<div class="impact-progress-bar"><div class="impact-progress-fill" style="width:' + Math.round((pg || 0) * 100) + '%;background:' + colorStr(pg) + '"></div></div>'
      + '<span style="font-family:\'DM Mono\',monospace;font-size:11px;color:' + colorStr(pg) + '">LAG-' + String(lag.lag_number).padStart(2,'0') + ': ' + fmtPct(pg) + '</span>'
      + '</div></div>'
      + '</div>';
  }).filter(Boolean).join('');
  el.innerHTML = blocks || '<div class="empty-state">Brak powiązań. Kliknij „+ powiąż" na kartach LAG, aby dodać.</div>';
  el.querySelectorAll('.impact-chart').forEach(function(c){
    renderCorrelationChart(parseInt(c.dataset.chartLag, 10), parseInt(c.dataset.chartLead, 10), c);
  });
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.toggle('active', t.dataset.tab === tab); });
  document.getElementById('scoreboard-view').style.display = tab === 'scoreboard' ? '' : 'none';
  document.getElementById('impact-view').style.display = tab === 'impact' ? '' : 'none';
  if (tab === 'impact') renderImpactView();
}

function showLinkDropdown(lagId, anchor) {
  document.querySelectorAll('.link-dropdown').forEach(function(d){ d.remove(); });
  var existing = state.links.filter(function(l){ return l.lag_id === lagId; }).map(function(l){ return l.lead_id; });
  var avail = state.leads.filter(function(l){ return existing.indexOf(l.id) < 0; });
  if (!avail.length) { toast('Wszystkie LEAD-y już powiązane z tym LAG', 'success'); return; }
  var dd = document.createElement('div');
  dd.className = 'link-dropdown';
  var rect = anchor.getBoundingClientRect();
  dd.style.cssText = 'position:fixed;top:' + (rect.bottom + 4) + 'px;left:' + rect.left + 'px;z-index:300';
  dd.innerHTML = avail.map(function(l){ return '<div class="link-option" data-lag="' + lagId + '" data-lead="' + l.id + '">LEAD-' + String(l.lead_number).padStart(2,'0') + ': ' + esc(l.name) + '</div>'; }).join('');
  document.body.appendChild(dd);
  dd.addEventListener('click', function(e){
    if (e.target.matches('.link-option')) {
      addLink(parseInt(e.target.dataset.lag, 10), parseInt(e.target.dataset.lead, 10)).then(function(){ dd.remove(); });
      e.stopPropagation();
    }
  });
  setTimeout(function(){ document.addEventListener('click', function(){ dd.remove(); }, {once: true}); }, 100);
}

async function addLink(lagId, leadId) {
  var areaId = state.areas.length ? state.areas[0].id : 'os_malinovi';
  try {
    var row = await sbInsert('lag_lead_links', { area_id: areaId, lag_id: lagId, lead_id: leadId });
    if (row && row[0]) state.links.push(row[0]);
    renderAll();
    toast('Dodano powiązanie', 'success');
  } catch(e) { toast('Błąd: ' + e.message.slice(0, 60), 'error'); }
}

/* ═══════════════════════════════════
   UPDATE PROGRESS ROW IN-PLACE
═══════════════════════════════════ */
function refreshLagProg(lagId) {
  var row = document.getElementById('lag-prog-' + lagId);
  if (!row) return;
  var items = state.lagItems.filter(function(i){ return i.lag_id === lagId; });
  var itemIds = items.map(function(i){ return i.id; });
  var tds = row.querySelectorAll('td');
  // td[0]=name, td[1]=target, td[2..N]=weeks, td[N+1]=deadline, td[N+2]=actions
  state.allWeeks.forEach(function(w, idx){
    var val = lagProgress(itemIds, w);
    var td = tds[2 + idx];
    if (td) td.innerHTML = '<span class="progress-val ' + pColor(val) + '">' + fmtPct(val) + '</span>';
  });
}
function refreshLeadProg(leadId) {
  var row = document.getElementById('lead-prog-' + leadId);
  if (!row) return;
  var items = state.leadItems.filter(function(i){ return i.lead_id === leadId; });
  var itemIds = items.map(function(i){ return i.id; });
  var tds = row.querySelectorAll('td');
  // td[0]=name, td[1]=deadline, td[2..N]=weeks, td[N+1]=actions
  state.allWeeks.forEach(function(w, idx){
    var val = leadProgress(itemIds, w);
    var td = tds[2 + idx];
    if (td) td.innerHTML = '<span class="progress-val ' + pColor(val) + '">' + fmtPct(val) + '</span>';
  });
}

/* ═══════════════════════════════════
   LAG CELL EDIT
═══════════════════════════════════ */
function editLagCell(td) {
  if (td.querySelector('input')) return;
  var itemId = parseInt(td.dataset.item, 10);
  var week   = parseInt(td.dataset.week, 10);
  var prevStored = (state.lagWeeklyMap[itemId] || {})[week];
  var prevDisp = td.textContent.trim();
  var initVal = prevStored != null ? Math.round(parseFloat(prevStored) * 100) : '';

  td.classList.add('editing');
  td.innerHTML = '<input type="number" min="0" max="100" step="1" value="' + initVal + '" placeholder="0-100">';
  var inp = td.querySelector('input');
  inp.focus(); inp.select();

  function commit() {
    var raw = inp.value.trim();
    td.classList.remove('editing');
    if (raw === '' || isNaN(+raw)) { td.textContent = prevDisp; return; }
    var num = parseFloat(raw);
    if (num > 1) num = num / 100;
    num = Math.max(0, Math.min(1, num));
    td.textContent = fmtPct(num);

    sbUpsert('lag_weekly', { lag_item_id: itemId, week: week, value: num }, 'lag_item_id,week').then(function(){
      if (!state.lagWeeklyMap[itemId]) state.lagWeeklyMap[itemId] = {};
      state.lagWeeklyMap[itemId][week] = num;
      var item = state.lagItems.find(function(i){ return i.id === itemId; });
      if (item) refreshLagProg(item.lag_id);
      flash(td, 'saved');
    }).catch(function(e){
      td.textContent = prevDisp;
      if (prevStored != null) { if (!state.lagWeeklyMap[itemId]) state.lagWeeklyMap[itemId] = {}; state.lagWeeklyMap[itemId][week] = prevStored; }
      flash(td, 'error');
      toast('Błąd zapisu: ' + e.message, 'error');
    });
  }

  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter') inp.blur();
    if (e.key === 'Escape') { td.classList.remove('editing'); td.textContent = prevDisp; }
  });
  inp.addEventListener('blur', commit);
}

/* ═══════════════════════════════════
   LEAD CELL TOGGLE
═══════════════════════════════════ */
function toggleLeadCell(td) {
  var itemId = parseInt(td.dataset.item, 10);
  var week   = parseInt(td.dataset.week, 10);
  var cur = (state.leadWeeklyMap[itemId] || {})[week];
  var curVal = cur != null ? parseFloat(cur) : 0;
  var newVal = curVal >= 0.999 ? 0 : 1;

  if (!state.leadWeeklyMap[itemId]) state.leadWeeklyMap[itemId] = {};
  state.leadWeeklyMap[itemId][week] = newVal;
  td.textContent = newVal >= 0.999 ? '✓' : '✗';
  td.className = td.className.replace(/\b(done|miss)\b/g, '').trim() + ' ' + (newVal >= 0.999 ? 'done' : 'miss');

  var item = state.leadItems.find(function(i){ return i.id === itemId; });
  sbUpsert('lead_weekly', { lead_item_id: itemId, week: week, value: newVal }, 'lead_item_id,week').then(function(){
    if (item) refreshLeadProg(item.lead_id);
  }).catch(function(e){
    state.leadWeeklyMap[itemId][week] = curVal;
    td.textContent = curVal >= 0.999 ? '✓' : '✗';
    td.className = td.className.replace(/\b(done|miss)\b/g, '').trim() + ' ' + (curVal >= 0.999 ? 'done' : 'miss');
    toast('Błąd: ' + e.message, 'error');
  });
}

/* ═══════════════════════════════════
   ADD WEEK
═══════════════════════════════════ */
function showAddWeek(btn, type, parentId) {
  if (btn.nextElementSibling && btn.nextElementSibling.classList.contains('add-week-inline')) return;
  var maxW = state.allWeeks.length ? Math.max.apply(null, state.allWeeks) : state.currentWeek;
  var suggest = maxW + 1;

  var wrap = document.createElement('span');
  wrap.className = 'add-week-inline';
  wrap.innerHTML = 'T<input type="number" min="1" max="99" value="' + suggest + '">'
    + '<button class="btn-ok">OK</button>'
    + '<button class="btn-cancel">✕</button>';
  btn.insertAdjacentElement('afterend', wrap);

  var inp = wrap.querySelector('input');
  inp.focus(); inp.select();

  function cancel(){ wrap.remove(); }
  function confirm(){
    var w = parseInt(inp.value, 10);
    if (isNaN(w) || w < 1 || w > 99) { toast('Nieprawidłowy numer', 'error'); return; }
    if (state.allWeeks.indexOf(w) >= 0) { toast('T' + w + ' już istnieje', 'error'); return; }
    state.allWeeks.push(w);
    state.allWeeks.sort(function(a,b){ return a-b; });
    wrap.remove();
    if (type === 'lag') reRenderLag(parentId); else reRenderLead(parentId);
  }
  wrap.querySelector('.btn-ok').addEventListener('click', confirm);
  wrap.querySelector('.btn-cancel').addEventListener('click', cancel);
  inp.addEventListener('keydown', function(e){ if(e.key==='Enter') confirm(); if(e.key==='Escape') cancel(); });
}

/* ═══════════════════════════════════
   ADD LAG ITEM FORM
═══════════════════════════════════ */
function showAddLagItem(lagId) {
  var ph = document.querySelector('.add-ph-lag[data-lag-id="' + lagId + '"]');
  if (!ph || document.getElementById('add-lag-f-' + lagId)) return;
  var colCount = 4 + state.allWeeks.length;
  var tr = document.createElement('tr');
  tr.id = 'add-lag-f-' + lagId;
  tr.className = 'add-item-row';
  tr.innerHTML = '<td colspan="' + colCount + '">'
    + '<div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap;">'
    + '<input id="alf-n-' + lagId  + '" type="text" placeholder="Nazwa kryterium" style="flex:1;min-width:140px;">'
    + '<input id="alf-t-' + lagId  + '" type="text" value="100" placeholder="Target %" style="width:65px;">'
    + '<input id="alf-d-' + lagId  + '" type="number" placeholder="Deadline T" min="1" max="99" style="width:78px;">'
    + '<button class="btn-ok" id="alf-ok-' + lagId + '">Dodaj</button>'
    + '<button class="btn-cancel" id="alf-cx-' + lagId + '">Anuluj</button>'
    + '</div></td>';
  ph.insertAdjacentElement('beforebegin', tr);
  document.getElementById('alf-n-' + lagId).focus();

  document.getElementById('alf-cx-' + lagId).addEventListener('click', function(){ tr.remove(); });
  document.getElementById('alf-ok-' + lagId).addEventListener('click', function(){
    var name = document.getElementById('alf-n-' + lagId).value.trim();
    if (!name) { toast('Podaj nazwę', 'error'); return; }
    var tgtR = parseFloat(document.getElementById('alf-t-' + lagId).value) || 1;
    if (tgtR > 1) tgtR = tgtR / 100;
    var dlR  = parseInt(document.getElementById('alf-d-' + lagId).value, 10) || null;
    var so   = state.lagItems.filter(function(i){ return i.lag_id === lagId; }).length;
    sbInsert('lag_items', { lag_id: lagId, name: name, target: tgtR, sort_order: so, deadline_week: dlR })
      .then(function(ins){
        var newItem = Array.isArray(ins) ? ins[0] : ins;
        if (newItem) state.lagItems.push(newItem);
        tr.remove();
        reRenderLag(lagId);
        toast('Dodano kryterium', 'success');
      }).catch(function(e){ toast('Błąd: ' + e.message, 'error'); });
  });
}

/* ═══════════════════════════════════
   EDIT NAME
═══════════════════════════════════ */
function editName(span) {
  if (span.classList.contains('editing-name')) return;
  var type = span.dataset.type;
  var id   = parseInt(span.dataset.id, 10);
  var prev = span.textContent.trim();
  span.classList.add('editing-name');
  span.innerHTML = '<input type="text" value="' + escA(prev) + '" style="min-width:120px;">';
  var inp = span.querySelector('input');
  inp.focus(); inp.select();

  function commit(){
    var newName = inp.value.trim();
    span.classList.remove('editing-name');
    if (!newName || newName === prev) { span.textContent = prev; return; }
    span.textContent = newName;
    var table  = type === 'lag' ? 'lag_items' : 'lead_items';
    var arr    = type === 'lag' ? state.lagItems : state.leadItems;
    sbPatch(table, 'id=eq.' + id, { name: newName }).then(function(){
      var it = arr.find(function(i){ return i.id === id; });
      if (it) it.name = newName;
    }).catch(function(e){
      span.textContent = prev;
      toast('Błąd: ' + e.message, 'error');
    });
  }
  inp.addEventListener('keydown', function(e){
    if (e.key === 'Enter') inp.blur();
    if (e.key === 'Escape') { span.classList.remove('editing-name'); span.textContent = prev; }
  });
  inp.addEventListener('blur', commit);
}

/* ═══════════════════════════════════
   DELETE
═══════════════════════════════════ */
function delLagItem(id) {
  if (!confirm('Usunąć to kryterium? Usunie też dane tygodniowe.')) return;
  var it = state.lagItems.find(function(i){ return i.id === id; });
  var lagId = it ? it.lag_id : null;
  sbDelete('lag_weekly', 'lag_item_id=eq.' + id)
    .then(function(){ return sbDelete('lag_items', 'id=eq.' + id); })
    .then(function(){
      state.lagItems = state.lagItems.filter(function(i){ return i.id !== id; });
      delete state.lagWeeklyMap[id];
      if (lagId) reRenderLag(lagId);
      toast('Usunięto', 'success');
    }).catch(function(e){ toast('Błąd: ' + e.message, 'error'); });
}
function delLeadItem(id) {
  if (!confirm('Usunąć to zadanie? Usunie też dane tygodniowe.')) return;
  var it = state.leadItems.find(function(i){ return i.id === id; });
  var leadId = it ? it.lead_id : null;
  sbDelete('lead_weekly', 'lead_item_id=eq.' + id)
    .then(function(){ return sbDelete('lead_items', 'id=eq.' + id); })
    .then(function(){
      state.leadItems = state.leadItems.filter(function(i){ return i.id !== id; });
      delete state.leadWeeklyMap[id];
      if (leadId) reRenderLead(leadId);
      toast('Usunięto', 'success');
    }).catch(function(e){ toast('Błąd: ' + e.message, 'error'); });
}

/* ═══════════════════════════════════
   EVENT DELEGATION
═══════════════════════════════════ */
document.getElementById('content').addEventListener('click', function(e) {
  var t = e.target;

  var lagCell = t.closest('.cell-lag');
  if (lagCell && !lagCell.querySelector('input')) { editLagCell(lagCell); return; }

  var leadCell = t.closest('.cell-lead');
  if (leadCell) { toggleLeadCell(leadCell); return; }

  var nameSpan = t.closest('.item-name');
  if (nameSpan) { editName(nameSpan); return; }

  if (t.dataset.delLag)  { delLagItem(parseInt(t.dataset.delLag, 10));  return; }
  if (t.dataset.delLead) { delLeadItem(parseInt(t.dataset.delLead, 10)); return; }

  if (t.dataset.addwLag)  { showAddWeek(t, 'lag',  parseInt(t.dataset.addwLag, 10));  return; }
  if (t.dataset.addwLead) { showAddWeek(t, 'lead', parseInt(t.dataset.addwLead, 10)); return; }

  if (t.dataset.addiLag)  { showAddLagItem(parseInt(t.dataset.addiLag, 10));  return; }
  if (t.dataset.addiLead) { showAddLeadItem(parseInt(t.dataset.addiLead, 10)); return; }

  var linkAddBtn = t.closest('.link-add');
  if (linkAddBtn) { showLinkDropdown(parseInt(linkAddBtn.dataset.lagId, 10), linkAddBtn); e.stopPropagation(); return; }

  var linkTag = t.closest('.link-tag');
  if (linkTag) {
    var targetEl = document.querySelector('[data-section-id="' + linkTag.dataset.highlight + '"]');
    if (targetEl) {
      if (document.getElementById('scoreboard-view').style.display === 'none') switchTab('scoreboard');
      setTimeout(function(){
        targetEl.scrollIntoView({behavior: 'smooth', block: 'center'});
        targetEl.classList.add('highlighted');
        setTimeout(function(){ targetEl.classList.remove('highlighted'); }, 1500);
      }, 50);
    }
    return;
  }
});

/* Global: tabs and impact-view actions */
document.addEventListener('click', function(e) {
  if (e.target.matches('.tab')) { switchTab(e.target.dataset.tab); return; }
  if (e.target.matches('.unlink-btn')) {
    var lagId  = parseInt(e.target.dataset.lagId, 10);
    var leadId = parseInt(e.target.dataset.leadId, 10);
    if (confirm('Usunąć powiązanie LEAD→LAG?')) {
      sbDelete('lag_lead_links', 'lag_id=eq.' + lagId + '&lead_id=eq.' + leadId)
        .then(function(){
          state.links = state.links.filter(function(l){ return !(l.lag_id === lagId && l.lead_id === leadId); });
          renderAll();
          renderImpactView();
          toast('Usunięto powiązanie', 'success');
        })
        .catch(function(e2){ toast('Błąd: ' + e2.message.slice(0, 60), 'error'); });
    }
    return;
  }
});

/* ═══════════════════════════════════
   UTILS
═══════════════════════════════════ */
function flash(el, cls){
  el.classList.add(cls);
  setTimeout(function(){ el.classList.remove(cls); }, 1200);
}
function toast(msg, type) {
  var c = document.getElementById('toast');
  var el = document.createElement('div');
  el.className = 'toast-item ' + (type || 'success');
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(function(){ el.remove(); }, 3500);
}
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escA(s) {
  return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

═══════════════════════════════════ */

═══════════════════════════════════ */
async function init() {
  try {
    await loadAll();
    renderAll();
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="empty-state" style="color:var(--red);">Błąd ładowania danych:<br><code>' + esc(e.message) + '</code><br>'
      + '<small style="color:var(--text-muted);">Sprawdź połączenie z Supabase i uprawnienia RLS.</small></div>';
    var ob = document.getElementById('offline-banner');
    ob.style.display = 'block';
    ob.textContent = '⚡ Błąd połączenia z bazą Supabase';
  }
}
init();
