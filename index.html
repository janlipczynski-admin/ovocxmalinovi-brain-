<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>OvocxMalinowi — Przegląd WIG 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F2; --white: #FFFFFF;
  --text: #1A1A1A; --muted: #6B6B6B; --border: #E5E4E0;
  --green: #2D6A4F; --orange: #E07A2F; --red: #C0392B;
  --f: 'Familjen Grotesk', sans-serif; --fm: 'DM Mono', monospace;
  --r: 8px; --sh: 0 1px 2px rgba(0,0,0,.05), 0 4px 16px rgba(0,0,0,.06);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--f); line-height: 1.5; min-height: 100vh; }

nav {
  background: var(--white); border-bottom: 1px solid var(--border);
  height: 56px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 32px; position: sticky; top: 0; z-index: 50;
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.brand svg { width: 28px; height: 28px; }
.brand-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
.nav-week {
  font-family: var(--fm); font-size: 11px; font-weight: 500;
  background: #F0EFE9; border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; color: var(--muted); letter-spacing: .04em;
}

main { max-width: 1100px; margin: 0 auto; padding: 32px 24px; }
.page-title {
  font-size: 11px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .1em; margin-bottom: 20px;
}
.wig-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
@media (max-width: 680px) { .wig-grid { grid-template-columns: 1fr; } }

.wig-card {
  background: var(--white); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; box-shadow: var(--sh); cursor: pointer;
  text-decoration: none; color: var(--text); display: block;
  transition: box-shadow .15s, transform .15s;
}
.wig-card:hover { box-shadow: 0 4px 24px rgba(0,0,0,.1); transform: translateY(-1px); }
.wig-card-head { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 3px; }
.wig-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.wig-week-tag {
  font-family: var(--fm); font-size: 10px; color: var(--muted);
  background: #F0EFE9; border: 1px solid var(--border);
  border-radius: 5px; padding: 3px 8px; letter-spacing: .04em; white-space: nowrap;
}
.wig-owner { font-size: 13px; color: var(--muted); margin-bottom: 2px; }
.wig-desc { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.wig-deadline { font-family: var(--fm); font-size: 11px; color: var(--muted); margin-bottom: 16px; }
.wig-spacer { margin-bottom: 16px; }

.progress-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.progress-track { flex: 1; height: 6px; background: #E5E4E0; border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 3px; transition: width .4s; }
.progress-pct { font-family: var(--fm); font-size: 13px; font-weight: 500; min-width: 36px; text-align: right; }

.status-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
.pace-txt { font-size: 11px; color: var(--muted); }
.status-badge {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 100px;
  background: #E8F4EE; color: var(--green);
}
.status-badge.orange { background: #FEF0E4; color: var(--orange); }
.status-badge.red { background: #FCECEA; color: var(--red); }

.lag-mini-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 12px; }
.lag-mini { display: flex; align-items: center; gap: 6px; }
.lag-mini-code { font-family: var(--fm); font-size: 10px; color: var(--muted); min-width: 44px; }
.lag-mini-bar { flex: 1; height: 3px; background: #E5E4E0; border-radius: 2px; overflow: hidden; }
.lag-mini-fill { height: 100%; background: var(--orange); border-radius: 2px; }
.lag-mini-pct { font-family: var(--fm); font-size: 10px; color: var(--muted); min-width: 28px; text-align: right; }

.empty-card {
  background: var(--white); border: 1px dashed var(--border); border-radius: 12px;
  padding: 28px 24px; text-align: center; color: var(--muted);
  display: block; text-decoration: none;
}
.empty-card-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 3px; }
.empty-card-owner { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
.empty-hint { font-size: 12px; margin-bottom: 12px; }
.empty-btn {
  display: inline-block; font-size: 12px; font-weight: 600;
  background: #F0EFE9; border: 1px solid var(--border); border-radius: 6px;
  padding: 6px 14px; color: var(--muted);
}

.skeleton {
  background: linear-gradient(90deg, #F0EFE9 25%, #E8E6DE 50%, #F0EFE9 75%);
  background-size: 200% 100%; animation: shimmer 1.5s infinite;
  border-radius: 6px; height: 14px;
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(16px);
  background: var(--text); color: white; padding: 10px 20px;
  border-radius: 8px; font-size: 13px; font-weight: 500;
  opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 999;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<nav>
  <a class="brand" href="index.html">
    <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
      <circle cx="32" cy="28" r="8" fill="none" stroke="#C0392B" stroke-width="2.5"/>
      <circle cx="21" cy="35" r="8" fill="none" stroke="#C0392B" stroke-width="2.5"/>
      <circle cx="43" cy="35" r="8" fill="none" stroke="#C0392B" stroke-width="2.5"/>
      <circle cx="26" cy="45" r="8" fill="none" stroke="#C0392B" stroke-width="2.5"/>
      <circle cx="38" cy="45" r="8" fill="none" stroke="#C0392B" stroke-width="2.5"/>
    </svg>
    <span class="brand-name">OvocxMalinowi</span>
  </a>
  <span class="nav-week" id="nav-week">T—</span>
</nav>

<main>
  <div class="page-title">Przegląd WIG 2026</div>
  <div class="wig-grid" id="wig-grid">
    <div class="wig-card">
      <div class="skeleton" style="width:55%;margin-bottom:10px"></div>
      <div class="skeleton" style="width:35%;margin-bottom:20px"></div>
      <div class="skeleton" style="margin-bottom:8px"></div>
      <div class="skeleton" style="width:70%"></div>
    </div>
    <div class="wig-card">
      <div class="skeleton" style="width:55%;margin-bottom:10px"></div>
      <div class="skeleton" style="width:35%;margin-bottom:20px"></div>
      <div class="skeleton" style="margin-bottom:8px"></div>
      <div class="skeleton" style="width:70%"></div>
    </div>
    <div class="wig-card">
      <div class="skeleton" style="width:55%;margin-bottom:10px"></div>
      <div class="skeleton" style="width:35%;margin-bottom:20px"></div>
      <div class="skeleton" style="margin-bottom:8px"></div>
      <div class="skeleton" style="width:70%"></div>
    </div>
    <div class="wig-card">
      <div class="skeleton" style="width:55%;margin-bottom:10px"></div>
      <div class="skeleton" style="width:35%;margin-bottom:20px"></div>
      <div class="skeleton" style="margin-bottom:8px"></div>
      <div class="skeleton" style="width:70%"></div>
    </div>
  </div>
</main>

<div id="toast" class="toast"></div>

<script>
const SB  = 'https://fssfuricylndtetfktex.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzc2Z1cmljeWxuZHRldGZrdGV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODUzMjgsImV4cCI6MjA4OTI2MTMyOH0.Xs6kne86IQpGb8ShvU9zntQDTkQNGBuXKajxnWHOUYQ';
const H   = { 'apikey': KEY, 'Authorization': `Bearer ${KEY}`, 'Content-Type': 'application/json' };

async function sbGet(path) {
  const r = await fetch(`${SB}/rest/v1/${path}`, { headers: H });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}

// ── Logika wyników ──────────────────────────────────────────────

function calcLagScore(items) {
  if (!items || !items.length) return 0;
  const done = items.filter(item =>
    item.lag_weekly && item.lag_weekly.some(w => w.value === 1)
  ).length;
  return done / items.length;
}

function calcWigScore(lags) {
  if (!lags || !lags.length) return 0;
  const totalW = lags.reduce((s, l) => s + (l.weight || 100), 0);
  if (!totalW) return 0;
  return lags.reduce((s, l) => s + calcLagScore(l.lag_items) * (l.weight || 100), 0) / totalW;
}

function idealPace(week) { return Math.max(0, Math.min(1, (week - 10) / 12)); }

function statusInfo(score, pace) {
  const d = score - pace;
  if (d >= 0)    return { label: 'Na dobrej drodze', cls: '',       color: '#2D6A4F' };
  if (d >= -0.1) return { label: 'Do nadrobienia',   cls: 'orange', color: '#E07A2F' };
  return               { label: 'Zagrożone',          cls: 'red',    color: '#C0392B' };
}

function pct(v) { return Math.round(v * 100); }

function fmtDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return dt.toLocaleDateString('pl-PL', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// ── Render kart ─────────────────────────────────────────────────

function renderCard(area, lags, week) {
  const wigScore = calcWigScore(lags);
  const pace     = idealPace(week);
  const st       = statusInfo(wigScore, pace);

  const lagMini = lags.length
    ? `<div class="lag-mini-grid">${lags.slice(0, 4).map(l => {
        const s = calcLagScore(l.lag_items);
        return `<div class="lag-mini">
          <span class="lag-mini-code">${l.code || 'LAG'}</span>
          <div class="lag-mini-bar"><div class="lag-mini-fill" style="width:${pct(s)}%"></div></div>
          <span class="lag-mini-pct">${pct(s)}%</span>
        </div>`;
      }).join('')}</div>`
    : `<div style="font-size:12px;color:var(--muted)">Brak LAG-ów</div>`;

  return `<a class="wig-card" href="dashboard-4dx.html?area=${encodeURIComponent(area.slug || area.id)}">
    <div class="wig-card-head">
      <div class="wig-name">${area.name || 'Obszar'}</div>
      <span class="wig-week-tag">T${week}</span>
    </div>
    <div class="wig-owner">${area.owner || '—'}</div>
    ${area.wig_description ? `<div class="wig-desc">${area.wig_description}</div>` : ''}
    ${area.wig_deadline
      ? `<div class="wig-deadline">Deadline: ${fmtDate(area.wig_deadline)}</div>`
      : `<div class="wig-spacer"></div>`}
    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct(wigScore)}%;background:${st.color}"></div>
      </div>
      <span class="progress-pct" style="color:${st.color}">${pct(wigScore)}%</span>
    </div>
    <div class="status-row">
      <span class="pace-txt">Idealne tempo: ${pct(pace)}%</span>
      <span class="status-badge ${st.cls}">${st.label}</span>
    </div>
    ${lagMini}
  </a>`;
}

function renderEmptyCard(area) {
  return `<a class="empty-card" href="dashboard-4dx.html?area=${encodeURIComponent(area.slug || area.id)}">
    <div class="empty-card-name">${area.name || 'Obszar'}</div>
    <div class="empty-card-owner">${area.owner || '—'}</div>
    <div class="empty-hint">Brak danych — dodaj LAG-i</div>
    <span class="empty-btn">+ Skonfiguruj obszar</span>
  </a>`;
}

function toast(msg, type = 'success') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `toast toast-${type} show`;
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── Init ────────────────────────────────────────────────────────

async function init() {
  try {
    const [areas, lags, cfg] = await Promise.all([
      sbGet('areas?select=*&order=id'),
      sbGet('lags?select=*,lag_items(*,lag_weekly(*))&order=id'),
      sbGet('config?key=eq.current_week&select=value')
    ]);

    const week = cfg.length ? parseInt(cfg[0].value, 10) : 12;
    document.getElementById('nav-week').textContent = `T${week}`;

    const grid = document.getElementById('wig-grid');
    if (!areas.length) {
      grid.innerHTML = '<div style="color:var(--muted);font-size:14px;grid-column:1/-1;text-align:center;padding:48px">Brak obszarów w bazie</div>';
      return;
    }

    grid.innerHTML = areas.map(area => {
      const areaLags = lags.filter(l => l.area_id === area.id);
      return areaLags.length
        ? renderCard(area, areaLags, week)
        : renderEmptyCard(area);
    }).join('');

  } catch (e) {
    toast('Błąd ładowania: ' + e.message, 'error');
    console.error(e);
  }
}

init();
</script>
</body>
</html>
