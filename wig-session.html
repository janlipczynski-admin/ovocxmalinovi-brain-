<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WIG Session — OvocxMalinowi</title>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #F7F6F2;
  --white: #FFFFFF;
  --s1: #F0EFE9;
  --s2: #E8E6DE;
  --t1: #1C1B18;
  --t2: #6B6A65;
  --t3: #AEACA4;
  --acc: #D64E12;
  --gr: #16a34a;
  --gr2: #dcfce7;
  --or: #d97706;
  --or2: #fef3c7;
  --re: #dc2626;
  --re2: #fee2e2;
  --bl: #1A5EA8;
  --bl2: #E8F0FA;
  --f: 'Familjen Grotesk', sans-serif;
  --fm: 'DM Mono', monospace;
  --r: 12px;
  --sh: 0 1px 4px rgba(0,0,0,.08);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; }
body { background: var(--bg); color: var(--t1); font-family: var(--f); line-height: 1.5; min-height: 100vh; }

/* NAV */
nav {
  background: var(--white);
  border-bottom: 1px solid var(--s2);
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  position: sticky;
  top: 0;
  z-index: 50;
}
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
.brand-icon { width: 32px; height: 32px; background: var(--t1); border-radius: 6px; display: flex; align-items: center; justify-content: center; color: white; font-size: 10px; font-weight: 700; letter-spacing: .02em; }
.brand-name { font-size: 14px; font-weight: 600; color: var(--t1); letter-spacing: -.01em; }
.brand-sub { font-size: 13px; color: var(--t3); margin-left: 2px; }
.nav-right { display: flex; align-items: center; gap: 10px; }
.week-tag { background: var(--s1); border: 1px solid var(--s2); border-radius: 6px; padding: 5px 11px; font-family: var(--fm); font-size: 11px; font-weight: 500; color: var(--t2); letter-spacing: .03em; }
.week-nav { display: flex; align-items: center; gap: 4px; }
.wk-btn { background: none; border: 1px solid var(--s2); border-radius: 5px; width: 26px; height: 26px; cursor: pointer; font-size: 14px; color: var(--t2); display: flex; align-items: center; justify-content: center; transition: border-color .15s, color .15s; }
.wk-btn:hover:not(:disabled) { border-color: var(--t1); color: var(--t1); }
.wk-btn:disabled { opacity: .3; cursor: not-allowed; }
.back-link { font-size: 13px; color: var(--t2); text-decoration: none; white-space: nowrap; }
.back-link:hover { color: var(--t1); }

/* LAYOUT */
.page { max-width: 960px; margin: 0 auto; padding: 32px 24px; }

/* MEMBER CARD */
.member-card {
  background: var(--white);
  border: 1px solid var(--s2);
  border-radius: var(--r);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--sh);
}
.member-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--s2);
}
.avatar {
  width: 40px; height: 40px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--fm); font-size: 12px; font-weight: 500;
  flex-shrink: 0;
  letter-spacing: .04em;
}
.avatar-iza    { background: #FBEAF0; color: #72243E; }
.avatar-jan    { background: #E6F1FB; color: #0C447C; }
.avatar-kacper { background: #EAF3DE; color: #27500A; }
.avatar-olgierd{ background: #FAEEDA; color: #633806; }
.avatar-renia  { background: #EEEDFE; color: #3C3489; }
.member-name { font-size: 16px; font-weight: 700; letter-spacing: -.01em; }
.member-role { font-size: 12px; color: var(--t3); font-family: var(--fm); }

/* COMMITMENT ITEMS */
.commit-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--s1);
}
.commit-item:last-of-type { border-bottom: none; }
.commit-emoji { font-size: 20px; width: 26px; text-align: center; flex-shrink: 0; line-height: 1; }
.curr-input {
  flex: 1;
  background: var(--s1);
  border: 1px solid var(--s2);
  border-radius: 5px;
  padding: 6px 10px;
  font-family: var(--f);
  font-size: 13px;
  outline: none;
  color: var(--t1);
}
.curr-input:focus { border-color: var(--bl); background: var(--white); }
.pct-input {
  width: 90px;
  background: var(--s1);
  border: 1px solid var(--s2);
  border-radius: 5px;
  padding: 6px 8px;
  font-family: var(--fm);
  font-size: 12px;
  outline: none;
  color: var(--t1);
  text-align: right;
  flex-shrink: 0;
}
.pct-input:focus { border-color: var(--bl); background: var(--white); }
.del-btn {
  background: none; border: none; cursor: pointer;
  color: var(--t3); font-size: 14px; padding: 2px 6px;
  transition: color .15s; flex-shrink: 0;
  font-family: var(--f); line-height: 1;
}
.del-btn:hover { color: var(--re); }
.add-commit-btn {
  display: block; width: 100%;
  background: none; border: 1px dashed var(--s2);
  border-radius: 6px; padding: 8px 14px;
  font-family: var(--f); font-size: 12px;
  color: var(--t3); cursor: pointer;
  transition: border-color .15s, color .15s;
  margin-top: 8px; text-align: left;
}
.add-commit-btn:hover { border-color: var(--t2); color: var(--t1); }

.card-footer {
  display: flex;
  justify-content: flex-end;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--s2);
}
.btn-save {
  background: var(--t1); color: white; border: none;
  border-radius: 6px; padding: 8px 20px;
  font-family: var(--f); font-size: 13px; font-weight: 700;
  cursor: pointer; transition: background .15s;
}
.btn-save:hover { background: #2e2d28; }
.btn-save:disabled { opacity: .35; cursor: not-allowed; }

/* HISTORY TABLE */
.history-card {
  background: var(--white);
  border: 1px solid var(--s2);
  border-radius: var(--r);
  padding: 24px;
  box-shadow: var(--sh);
  margin-top: 8px;
}
.history-title {
  font-size: 13px; font-weight: 700;
  letter-spacing: -.01em; margin-bottom: 16px;
  text-transform: uppercase; font-size: 11px;
  color: var(--t2); letter-spacing: .08em;
}
.hist-table { width: 100%; border-collapse: collapse; }
.hist-table th {
  font-family: var(--fm); font-size: 10px; font-weight: 500;
  color: var(--t3); text-align: left; padding: 4px 8px 8px;
  letter-spacing: .06em; text-transform: uppercase;
}
.hist-table td { padding: 6px 8px; font-size: 13px; }
.hist-table tr { border-bottom: 1px solid var(--s1); }
.hist-table tr:last-child { border-bottom: none; }
.hist-cell {
  font-family: var(--fm); font-size: 12px; font-weight: 500;
  padding: 3px 8px; border-radius: 5px; display: inline-block;
}
.hist-g { background: #EAF3DE; color: #27500A; }
.hist-o { background: #FAEEDA; color: #633806; }
.hist-r { background: #FCEBEB; color: #791F1F; }
.hist-s { background: #F3F4F6; color: #6B7280; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--t1); color: white;
  border-radius: 7px; padding: 11px 16px;
  font-size: 13px; font-weight: 500;
  z-index: 400; opacity: 0; transform: translateY(8px);
  transition: all .22s; pointer-events: none;
}
.toast.on { opacity: 1; transform: translateY(0); }

/* LOADING */
.state { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 72px 20px; gap: 12px; }
.spinner { width: 24px; height: 24px; border: 2px solid var(--s2); border-top-color: var(--t1); border-radius: 50%; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
.state-txt { font-family: var(--fm); font-size: 11px; color: var(--t3); }
.err-box { background: #fee2e2; border: 1px solid rgba(220,38,38,.15); border-radius: var(--r); padding: 20px; color: var(--re); font-size: 13px; }
</style>
</head>
<body>

<nav>
  <div style="display:flex;align-items:center;gap:16px;">
    <a class="back-link" href="dashboard-4dx.html">← Wróć</a>
    <div class="brand">
      <div class="brand-icon">OxM</div>
      <span class="brand-name">OvocxMalinowi</span>
      <span class="brand-sub">WIG Session</span>
    </div>
  </div>
  <div class="nav-right">
    <div class="week-nav">
      <button class="wk-btn" id="wk-prev" title="Poprzedni tydzień">‹</button>
      <div class="week-tag" id="wtag">T—</div>
      <button class="wk-btn" id="wk-next" title="Następny tydzień">›</button>
    </div>
  </div>
</nav>

<div class="page">
  <div id="root">
    <div class="state"><div class="spinner"></div><div class="state-txt">Ładowanie danych…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var BASE = 'https://fssfuricylndtetfktex.supabase.co';
var KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZzc2Z1cmljeWxuZHRldGZrdGV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODUzMjgsImV4cCI6MjA4OTI2MTMyOH0.Xs6kne86IQpGb8ShvU9zntQDTkQNGBuXKajxnWHOUYQ';
var HD   = { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY };

var MEMBERS = ['Iza', 'Jan', 'Kacper', 'Olgierd', 'Renia'];
var MEMBER_INITIALS = { Iza: 'Iz', Jan: 'Ja', Kacper: 'Ka', Olgierd: 'Ol', Renia: 'Re' };
var MEMBER_ROLES = { Iza: '', Jan: 'CEO', Kacper: 'Sprzedaż', Olgierd: 'Reklamacje', Renia: '' };
var MEMBER_AVATAR_CLS = { Iza: 'avatar-iza', Jan: 'avatar-jan', Kacper: 'avatar-kacper', Olgierd: 'avatar-olgierd', Renia: 'avatar-renia' };

var D = { week: 12, viewWeek: 12, commitments: [] };

// items[member] = list of {id: null|uuid, text: string, result_pct: null|number} — bieżący tydzień
var items = { Iza: [], Jan: [], Kacper: [], Olgierd: [], Renia: [] };

function emojiFor(pct) {
  if (pct === null || pct === undefined || pct === '') return '';
  var v = parseInt(pct, 10);
  if (isNaN(v)) return '';
  if (v >= 75) return '😊';
  if (v >= 50) return '😐';
  return '😞';
}

async function q(path, opts) {
  opts = opts || {};
  var r = await fetch(BASE + '/rest/v1/' + path, Object.assign({ headers: HD }, opts));
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}

function notify(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(function() { t.classList.remove('on'); }, 3000);
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}


async function loadWeekData(w) {
  document.getElementById('root').innerHTML = '<div class="state"><div class="spinner"></div><div class="state-txt">Ładowanie T' + w + '…</div></div>';
  try {
    var minW = Math.max(1, w - 3);
    var rows = await q('wig_commitments?week=gte.' + minW + '&week=lte.' + w + '&order=created_at.asc');

    MEMBERS.forEach(function(m) {
      items[m] = rows.filter(function(r) { return r.member === m && r.week === w; })
        .map(function(r) { return { id: r.id, text: r.commitment, result_pct: r.result_pct }; });
    });

    D.commitments = rows;
    updateWeekUI();
    render();
  } catch(e) {
    document.getElementById('root').innerHTML = '<div class="err-box">Błąd połączenia z bazą danych:<br><small>' + esc(e.message) + '</small></div>';
  }
}

function updateWeekUI() {
  document.getElementById('wtag').textContent = 'T' + D.viewWeek;
  var prevBtn = document.getElementById('wk-prev');
  var nextBtn = document.getElementById('wk-next');
  if (prevBtn) prevBtn.disabled = D.viewWeek <= 1;
  if (nextBtn) nextBtn.disabled = D.viewWeek >= D.week + 1;
}

function attachWeekNav() {
  var prevBtn = document.getElementById('wk-prev');
  var nextBtn = document.getElementById('wk-next');
  if (prevBtn) {
    prevBtn.addEventListener('click', function() {
      if (D.viewWeek <= 1) return;
      D.viewWeek--;
      MEMBERS.forEach(function(m) { items[m] = []; });
      loadWeekData(D.viewWeek);
    });
  }
  if (nextBtn) {
    nextBtn.addEventListener('click', function() {
      if (D.viewWeek >= D.week + 1) return;
      D.viewWeek++;
      MEMBERS.forEach(function(m) { items[m] = []; });
      loadWeekData(D.viewWeek);
    });
  }
}

async function init() {
  try {
    var cfg = await q('config?key=eq.current_week');
    D.week = cfg.length ? parseInt(cfg[0].value, 10) : 12;
    D.viewWeek = D.week;
    attachDelegatedHandlers();
    attachWeekNav();
    await loadWeekData(D.viewWeek);
  } catch(e) {
    document.getElementById('root').innerHTML = '<div class="err-box">Błąd połączenia z bazą danych:<br><small>' + esc(e.message) + '</small></div>';
  }
}

function render() {
  var html = '';
  MEMBERS.forEach(function(m) {
    html += renderMember(m);
  });
  html += renderHistory();
  document.getElementById('root').innerHTML = html;
}

function renderMember(m) {
  var list = items[m];
  var listHtml = '';
  list.forEach(function(item, idx) {
    var emoji = emojiFor(item.result_pct);
    var pctVal = (item.result_pct !== null && item.result_pct !== undefined) ? item.result_pct : '';
    listHtml += '<div class="commit-item">'
      + '<span class="commit-emoji">' + emoji + '</span>'
      + '<input type="text" class="curr-input" data-curr-input="' + m + ':' + idx + '" placeholder="Zobowiązanie T' + D.viewWeek + '…" value="' + esc(item.text) + '">'
      + '<input type="number" class="pct-input" min="0" max="100" data-pct-input="' + m + ':' + idx + '" placeholder="% wykonania" value="' + esc(pctVal) + '">'
      + '<button class="del-btn" data-del-curr="' + m + ':' + idx + '" title="Usuń">✕</button>'
      + '</div>';
  });

  return '<div class="member-card" id="card-' + m + '">'
    + '<div class="member-head">'
    + '<div class="avatar ' + MEMBER_AVATAR_CLS[m] + '">' + MEMBER_INITIALS[m] + '</div>'
    + '<div>'
    + '<div class="member-name">' + esc(m) + '</div>'
    + '<div class="member-role">' + esc(MEMBER_ROLES[m]) + '</div>'
    + '</div>'
    + '</div>'
    + '<div id="curr-list-' + m + '">' + listHtml + '</div>'
    + '<button class="add-commit-btn" data-add-for="' + m + '">+ dodaj zobowiązanie</button>'
    + '<div class="card-footer">'
    + '<button class="btn-save" data-save="' + m + '">Zapisz ' + m + '</button>'
    + '</div>'
    + '</div>';
}

function renderHistory() {
  var allWeeks = [];
  var maxW = D.viewWeek;
  for (var w = maxW; w >= Math.max(1, maxW - 3); w--) allWeeks.push(w);

  var html = '<div class="history-card">'
    + '<div class="history-title">Historia ostatnich tygodni</div>'
    + '<table class="hist-table">'
    + '<thead><tr><th>Tydzień</th>';
  MEMBERS.forEach(function(m) { html += '<th>' + esc(m) + '</th>'; });
  html += '</tr></thead><tbody>';

  allWeeks.forEach(function(w) {
    html += '<tr><td style="font-family:var(--fm);font-size:12px;color:var(--t2);">T' + w + '</td>';
    MEMBERS.forEach(function(m) {
      var items = D.commitments.filter(function(r) { return r.member === m && r.week === w; });
      var rated = items.filter(function(r) { return r.result_pct !== null && r.result_pct !== undefined; });
      if (!rated.length) {
        html += '<td><span class="hist-cell hist-s">—</span></td>';
      } else {
        var avg = Math.round(rated.reduce(function(s, r) { return s + r.result_pct; }, 0) / rated.length);
        var cls = avg >= 75 ? 'hist-g' : avg >= 50 ? 'hist-o' : 'hist-r';
        var emoji = avg >= 75 ? '😊' : avg >= 50 ? '😐' : '😞';
        html += '<td><span class="hist-cell ' + cls + '">' + emoji + ' ' + avg + '%</span></td>';
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

function attachDelegatedHandlers() {
  document.addEventListener('input', function(e) {
    // sync text
    var inp = e.target.closest('[data-curr-input]');
    if (inp) {
      var parts = inp.dataset.currInput.split(':');
      var m = parts[0], idx = parseInt(parts[1], 10);
      if (items[m] && items[m][idx] !== undefined) items[m][idx].text = inp.value;
      return;
    }
    // sync % i odśwież emoji
    var pct = e.target.closest('[data-pct-input]');
    if (pct) {
      var parts = pct.dataset.pctInput.split(':');
      var m = parts[0], idx = parseInt(parts[1], 10);
      if (items[m] && items[m][idx] !== undefined) {
        var v = pct.value.trim();
        items[m][idx].result_pct = v === '' ? null : Math.min(100, Math.max(0, parseInt(v, 10)));
        // odśwież tylko emoji w tym samym wierszu
        var row = pct.closest('.commit-item');
        if (row) row.querySelector('.commit-emoji').textContent = emojiFor(items[m][idx].result_pct);
      }
    }
  });

  document.addEventListener('click', function(e) {
    // delete item
    var delBtn = e.target.closest('[data-del-curr]');
    if (delBtn) {
      var parts = delBtn.dataset.delCurr.split(':');
      var m = parts[0], idx = parseInt(parts[1], 10);
      var item = items[m] && items[m][idx];
      if (!item) return;
      if (item.id) {
        q('wig_commitments?id=eq.' + item.id, { method: 'DELETE' })
          .then(function() {
            D.commitments = D.commitments.filter(function(r) { return r.id !== item.id; });
            items[m].splice(idx, 1);
            rerenderMember(m);
            notify('Zobowiązanie usunięte');
          })
          .catch(function(e) { notify('Błąd: ' + e.message.slice(0, 60)); });
      } else {
        items[m].splice(idx, 1);
        rerenderMember(m);
        notify('Zobowiązanie usunięte');
      }
      return;
    }

    // add new commitment
    var addBtn = e.target.closest('[data-add-for]');
    if (addBtn) {
      var m = addBtn.dataset.addFor;
      items[m].push({ id: null, text: '', result_pct: null });
      rerenderMember(m);
      var list = document.getElementById('curr-list-' + m);
      if (list) {
        var inputs = list.querySelectorAll('.curr-input');
        if (inputs.length) inputs[inputs.length - 1].focus();
      }
      return;
    }

    // save member
    var saveBtn = e.target.closest('[data-save]');
    if (saveBtn) {
      saveMember(saveBtn.dataset.save, saveBtn);
      return;
    }
  });
}

function rerenderMember(m) {
  var card = document.getElementById('card-' + m);
  if (!card) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = renderMember(m);
  card.replaceWith(tmp.firstChild);
}

async function saveMember(m, btn) {
  btn.disabled = true;
  btn.textContent = 'Zapisuję…';
  var MH = Object.assign({}, HD, { Prefer: 'resolution=merge-duplicates,return=representation' });

  try {
    for (var i = 0; i < items[m].length; i++) {
      var it = items[m][i];
      if (!it.text.trim()) continue;
      var pct = (it.result_pct !== null && it.result_pct !== undefined) ? it.result_pct : null;
      if (it.id) {
        // PATCH — aktualizuj tekst i wynik
        await q('wig_commitments?id=eq.' + it.id, {
          method: 'PATCH',
          headers: Object.assign({}, HD, { Prefer: 'return=representation' }),
          body: JSON.stringify({ commitment: it.text.trim(), result_pct: pct, updated_at: new Date().toISOString() })
        });
      } else {
        // POST — nowe zobowiązanie
        var res = await q('wig_commitments', {
          method: 'POST',
          headers: MH,
          body: JSON.stringify({ member: m, week: D.viewWeek, commitment: it.text.trim(), result_pct: pct })
        });
        var created = Array.isArray(res) ? res[0] : res;
        if (created) {
          it.id = created.id;
          D.commitments.push(created);
        }
      }
    }

    notify('Zapisano ' + m + ' T' + D.viewWeek + ' ✓');
    rerenderMember(m);
    renderHistorySection();
  } catch(e) {
    notify('Błąd zapisu: ' + e.message.slice(0, 80));
  }

  btn.disabled = false;
  btn.textContent = 'Zapisz ' + m;
  updateWeekUI();
}

function renderHistorySection() {
  var histEl = document.querySelector('.history-card');
  if (!histEl) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = renderHistory();
  histEl.replaceWith(tmp.firstChild);
}

init();
</script>
</body>
</html>
